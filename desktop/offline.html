<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChronicRx — offline</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0B1220; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; }
  h1 { font-size: 22px; font-weight: 600; margin: 18px 0 6px; }
  p { color: rgba(255,255,255,.66); margin: 0 0 22px; font-size: 14.5px; }
  button { background: #3A5BD9; color: #fff; border: 0; border-radius: 10px; padding: 11px 22px; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  button:hover { background: #2E4BC0; }
</style>
</head>
<body>
<div>
  <svg width="56" height="56" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#3A5BD9"/><g transform="rotate(-45 18 18)"><rect x="7" y="13" width="22" height="10" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M12 13h6v10h-6a5 5 0 0 1 0-10z" fill="#34D399"/></g></svg>
  <h1>No internet connection</h1>
  <p>ChronicRx needs the internet to load patient data. Check the connection and try again.</p>
  <button onclick="location.href='https://baydon-create.github.io/chronic-refill/'">Try again</button>
</div>
<script>window.addEventListener('online', () => { location.href = 'https://baydon-create.github.io/chronic-refill/'; });</script>
</body>
</html>
