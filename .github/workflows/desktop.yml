# Builds the ChronicRx Windows app and publishes it as the latest GitHub release.
# The app loads the live dashboard and carries a copy of index.html for PCs that block github.io,
# so it is rebuilt when either changes.
name: Windows app

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'index.html', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build installer and portable exe
        working-directory: desktop
        run: |
          npm ci
          npm version 1.0.${{ github.run_number }} --no-git-tag-version
          npm run dist -- --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.${{ github.run_number }}
          name: ChronicRx for Windows 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Install:** download `ChronicRx-Setup.exe` and open it. ChronicRx is added to the desktop and Start menu.
            **No install:** `ChronicRx-Portable.exe` runs directly, e.g. from a USB stick.
            Dashboard updates arrive automatically. Where github.io is blocked, the app opens the copy of the dashboard built into this version.
          files: |
            desktop/dist/ChronicRx-Setup.exe
            desktop/dist/ChronicRx-Portable.exe
